when@dev: &dev
    zenstruck_foundry:
        persistence:
            flush_once: true

when@test:
    zenstruck_foundry:
        persistence:
            flush_once: true
        orm:
            reset:
                # Through the migrations, so tests run against the real baseline and the migration
                # table is filled (pending migrations send every page to the updater).
                mode: migrate
