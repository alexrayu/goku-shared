services:
  php:
    build:
      context: .
      args:
        PHP_VERSION: ${PHP_VERSION}
    ports:
      - "8010:80"
    volumes:
      - .:/app
    environment:
      # public/ as the docroot; set /app to test the root .htaccess fallback.
      APACHE_DOCUMENT_ROOT: /app/public
      # No DATABASE_URL: the web installer writes it to .env.local, as on a shared host.
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mariadb:${MARIADB_VERSION}
    environment:
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: app
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database_data:/var/lib/mysql
      - ./docker/db-init.sql:/docker-entrypoint-initdb.d/db-init.sql:ro

volumes:
  database_data:
